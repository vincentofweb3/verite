<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vérité — Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#12151B; --paper:#EDE7D9; --signal:#C1272D; --brass:#B08D57; --slate:#3C4551; --verified:#4F7942; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif;}
  .split{display:grid; grid-template-columns:1fr 1fr; min-height:100vh;}
  .left{background:var(--ink); color:var(--paper); display:flex; flex-direction:column; justify-content:center; padding:70px; position:relative;}
  .stamp-big{display:inline-block; border:3px solid var(--signal); color:var(--signal); border-radius:5px; padding:10px 22px; font-family:'JetBrains Mono',monospace; font-weight:700; letter-spacing:.08em; font-size:16px; transform:rotate(-4deg); margin-bottom:32px; width:fit-content;}
  .left h2{font-family:'Fraunces',serif; font-size:32px; font-weight:700; line-height:1.2; max-width:380px; margin:0;}
  .left p{color:#9aa0ac; font-size:14px; margin-top:16px; max-width:360px; line-height:1.6;}
  .right{background:var(--paper); display:flex; align-items:center; justify-content:center;}
  .form-card{width:360px;}
  .form-card h3{font-family:'Fraunces',serif; font-size:24px; color:var(--ink); margin:0 0 26px;}
  label{display:block; font-size:12px; color:#4a5568; margin-bottom:6px; font-weight:600;}
  input{width:100%; padding:11px 12px; border:1px solid #c9c2ae; border-radius:3px; font-size:14px; margin-bottom:18px; background:#fff; color:#12151B;}
  .btn-primary{width:100%; background:var(--signal); color:var(--paper); border:none; padding:13px; font-weight:600; font-size:13.5px; letter-spacing:.03em; text-transform:uppercase; border-radius:3px; margin-top:6px;}
  .google-btn{width:100%; background:transparent; border:1px solid #c9c2ae; color:#12151B; padding:12px; font-size:13.5px; font-weight:600; border-radius:3px; margin-bottom:20px;}
  .divider{text-align:center; font-size:11px; color:#8a8574; margin:0 0 20px; text-transform:uppercase; letter-spacing:.08em;}
  .switch{text-align:center; margin-top:18px; font-size:13px; color:#4a5568;}
  .switch a{color:var(--signal); font-weight:600; text-decoration:none;}
</style>
</head>
<body>
<div class="split">
  <div class="left">
    <div class="stamp-big">VÉRITÉ</div>
    <h2>Ground every scene in truth.</h2>
    <p>An agentic fact-checker for filmmakers — built on Gemini and Parallel Search.</p>
  </div>
  <div class="right">
    <div class="form-card">
      <h3>Create your workspace</h3>
      <button class="google-btn">Continue with Google</button>
      <div class="divider">or</div>
      <label>Full name</label>
      <input type="text" placeholder="Dana Wallace">
      <label>Work email</label>
      <input type="email" placeholder="dana@northwindpictures.com">
      <label>Workspace name</label>
      <input type="text" placeholder="Northwind Pictures">
      <label>Password</label>
      <input type="password" placeholder="••••••••">
      <button class="btn-primary">Create account</button>
      <div class="switch">Already have an account? <a href="#">Log in</a></div>
    </div>
  </div>
</div>
</body>
</html>
